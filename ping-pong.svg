<rect x="1" y="1" width="838" height="262" rx="17" fill="none" stroke="#27344c"/>
<text x="28" y="34" fill="#e2e8f0" font-family="Verdana,sans-serif" font-size="13" font-weight="bold" letter-spacing="3">BUILD · SHIP · ITERATE</text>
<text x="812" y="34" text-anchor="end" fill="#94a3b8" font-family="Verdana,sans-serif" font-size="11" letter-spacing="2">CREATIVE BREAK / PONG</text>
