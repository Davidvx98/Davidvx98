<svg xmlns="http://www.w3.org/2000/svg" width="840" height="264" viewBox="0 0 840 264" role="img" aria-labelledby="title desc">
<title id="title">Ping pong · Build, ship, iterate</title>
<desc id="desc">Una pelota rebota entre dos palas sobre una pista azul noche, turquesa y violeta.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#151d35"/></linearGradient><linearGradient id="edge"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
